spring:
  application:
    name: MoneyFi-api-gateway

  boot:
    admin:
      client:
        url: ${MONITOR_SERVICE_URL}
        username: admin
        password: ${MONITOR_PASSWORD:admin123}
        instance:
          metadata:
            user.name: client
            user.password: ${MONITOR_CLIENT_PASSWORD:client123}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: MoneyFi-user
          uri: ${USER_SERVICE_URL:http://localhost:8500}
          predicates:
            - Path=/api/v1/user-service/**

        # Swagger docs for user service
        - id: user-service-docs
          uri: ${USER_SERVICE_URL:http://localhost:8500}
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        - id: MoneyFi-Transaction
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8100}
          predicates:
            - Path=/api/v1/transaction/**

        # Swagger docs for transaction service
        - id: transaction-service-docs
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8100}
          predicates:
            - Path=/transaction-service/v3/api-docs
          filters:
            - RewritePath=/transaction-service/v3/api-docs, /v3/api-docs

        - id: MoneyFi-wealth-core
          uri: ${WEALTH_CORE_SERVICE_URL:http://localhost:8300}
          predicates:
            - Path=/api/v1/wealth-core/**

        # Swagger docs for wealth-core service
        - id: wealth-core-service-docs
          uri: ${WEALTH_CORE_SERVICE_URL:http://localhost:8300}
          predicates:
            - Path=/wealth-core-service/v3/api-docs
          filters:
            - RewritePath=/wealth-core-service/v3/api-docs, /v3/api-docs

jwt:
  secret: ekhfjulewfsuydg342fhdarewugafhs69aufg7efesdaf

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

server:
  port: 8765

springdoc:
  swagger-ui:
    urls:
      - name: MoneyFi-user
        url: /user-service/v3/api-docs
      - name: MoneyFi-Transaction
        url: /transaction-service/v3/api-docs
      - name: MoneyFi-wealth-core
        url: /wealth-core-service/v3/api-docs
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true

  api-docs:
    enabled: true

  override-with-generic-response: false