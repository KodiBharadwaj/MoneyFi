spring:
  profiles:
    active: ${PROFILE:local}
  application:
    name: MoneyFi-user
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.p6spy.engine.spy.P6SpyDriver}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
          facebook:
            client-id: xxxxxxxxxxxxxxxxxx
            client-secret: xxxxxxxxxxxxxxxxxxxxxxxxxx
            redirect-uri: "xxxxxxxxxxxxxxxxxxxxx"

  boot:
    admin:
      client:
        url: ${MONITOR_SERVICE_URL:http://localhost:8760}
        username: ${MONITOR_SERVICE_ADMIN_USERNAME:admin}
        password: ${MONITOR_SERVICE_ADMIN_PASSWORD:admin123}
        instance:
          metadata:
            user.name: ${MONITOR_SERVICE_CLIENT_USERNAME:client}
            user.password: ${MONITOR_SERVICE_CLIENT_PASSWORD:client123}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  #Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://default@127.0.0.1:6379}
      timeout: 5s
  cache:
    type: redis
    redis:
      time-to-live: 3600000

jwt:
  secret: ${JWT_SECRET:ekhfjulewfsuydg342fhdarewugafhs69aufg7efesdaf}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    stack:
      auto: false

application:
  bucket:
    name: ${AWS_S3_BUCKET_NAME}

  time-zone: ${DEFAULT_TIME_ZONE:Asia/Kolkata}

cloudinary:
  credentials:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  jackson:
    time-zone: ${DEFAULT_TIME_ZONE:Asia/Kolkata}

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [Request-Id=%X{requestId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: true
    server-url: /
  swagger-ui:
    enabled: true

request:
  gmail-sync-count: ${GMAIL_SYNC_COUNT:3}

server:
  port: ${APPLICATION_PORT:8500}
