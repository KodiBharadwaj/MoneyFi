spring:
  profiles:
    active: ${PROFILE:sqlserver}
  application:
    name:
      MoneyFi-wealth-core
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.p6spy.engine.spy.P6SpyDriver}

    jpa:
      hibernate:
        ddl-auto: none
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          highlight_sql: true

  boot:
    admin:
      client:
        url: ${MONITOR_SERVICE_URL:http://localhost:8760}
        username: ${MONITOR_SERVICE_ADMIN_USERNAME:admin}
        password: ${MONITOR_SERVICE_ADMIN_PASSWORD:admin123}
        instance:
          metadata:
            user.name: ${MONITOR_SERVICE_CLIENT_USERNAME:client}
            user.password: ${MONITOR_SERVICE_CLIENT_PASSWORD:client123}

  data:
    redis:
      url: ${REDIS_URL:redis://default@127.0.0.1:6379}
      timeout: 5s
  cache:
    type: redis
    redis:
      time-to-live: 3600000

jwt:
  secret: ${JWT_SECRET:ekhfjulewfsuydg342fhdarewugafhs69aufg7efesdaf}

application:
  time-zone: ${DEFAULT_TIME_ZONE:Asia/Kolkata}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [Request-Id=%X{requestId}] %logger{36} - %msg%n"

  jackson:
    time-zone: Asia/Kolkata

springdoc:
  api-docs:
    enabled: true
    server-url: /
  swagger-ui:
    enabled: true

account:
  statement:
    admin:
      pdf:
        password: ${ADMIN_PDF_PASSWORD}

service:
  urls:
    user-service: ${USER_SERVICE_URL:http://localhost:8500}
    transaction-service: ${TRANSACTION_SERVICE_URL:http://localhost:8100}

server:
  port: ${APPLICATION_PORT:8300}
