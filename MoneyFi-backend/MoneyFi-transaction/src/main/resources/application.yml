        instance:
          metadata:
            user.name: client
            user.password: client123

  #Redis Configuration
  data:
    redis:
      url: ${REDIS_URL}

jwt:
  secret: ekhfjulewfsuydg342fhdarewugafhs69aufg7efesdaf

application:
  time-zone: ${DEFAULT_TIME_ZONE:Asia/Kolkata}

management:
