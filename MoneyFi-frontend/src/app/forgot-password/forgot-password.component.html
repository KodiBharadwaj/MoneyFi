<nav class="navbar">
  <span class="brand-name" (click)="navigateTo('')" role="button" tabindex="0">
    <i class="fas fa-chart-pie"></i>
    MoneyFi
  </span>

  <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a routerLink="/login">Login</a></li>
    <li><a routerLink="/signup">Signup</a></li>
  </ul>
</nav>

<!-- Full-page loader while the server sends the OTP -->
<div *ngIf="isLoading" class="loading-overlay">
  <div class="spinner spinner-lg"></div>
  <span class="loading-text">Please wait for server to get OTP</span>
</div>

<main class="page-container">
  <section class="forgot-password-card">
    <div class="card-brand-name" (click)="navigateTo('')" role="button" tabindex="0">
      <i class="fas fa-chart-pie"></i>
      MoneyFi
    </div>
    <h2 class="title">Reset Password</h2>

    <div *ngIf="errorMessage" class="message error-message">
      <i class="fas fa-exclamation-circle"></i>
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message success-message">
      <i class="fas fa-check-circle"></i>
      {{ successMessage }}
    </div>

    <!-- Step 1: Email -->
    <form *ngIf="stage === 'email'" class="stage-container" (ngSubmit)="sendVerificationCode()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="input-field"
          placeholder="Enter your email"
          [(ngModel)]="email"
          required
        >
      </div>
      <button type="submit" class="submit-button" [disabled]="!email">
        Send Verification Code
      </button>
    </form>

    <!-- Step 2: Verification code -->
    <form *ngIf="stage === 'verification'" class="stage-container" (ngSubmit)="verifyCode()">
      <div class="form-group">
        <label for="verificationCode">Verification Code</label>
        <input
          type="text"
          id="verificationCode"
          name="verificationCode"
          class="input-field"
          placeholder="Enter 6-digit code"
          [(ngModel)]="verificationCode"
          [maxlength]="otpLength"
          required
        >
      </div>
      <button
        type="submit"
        class="submit-button"
        [disabled]="verificationCode.length !== otpLength || isSubmitting"
      >
        <span *ngIf="!isSubmitting">Verify Code</span>
        <span *ngIf="isSubmitting" class="spinner spinner-light"></span>
      </button>
      <button
        type="button"
        class="secondary-button"
        (click)="resendOtp('FORGOT_PASSWORD')"
        [disabled]="loadingResendOtp || isSubmitting"
      >
        <span *ngIf="!loadingResendOtp">Resend OTP</span>
        <span *ngIf="loadingResendOtp" class="spinner"></span>
      </button>
    </form>

    <!-- Step 3: New password -->
    <form *ngIf="stage === 'reset'" class="stage-container" (ngSubmit)="resetPassword()">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          class="input-field"
          placeholder="Enter new password"
          [(ngModel)]="newPassword"
          required
        >
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          class="input-field"
          placeholder="Confirm new password"
          [(ngModel)]="confirmPassword"
          required
        >
      </div>
      <button
        type="submit"
        class="submit-button"
        [disabled]="!newPassword || !confirmPassword || isSubmitting"
      >
        <span *ngIf="!isSubmitting">Reset Password</span>
        <span *ngIf="isSubmitting" class="spinner spinner-light"></span>
      </button>
    </form>

    <div class="back-to-login">
      <a routerLink="/login">Back to Login</a>
    </div>
  </section>
</main>
