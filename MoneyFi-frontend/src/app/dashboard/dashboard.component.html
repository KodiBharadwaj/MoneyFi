<div class="dashboard-container">

  <!-- Loading Spinner -->
  <div class="loading-spinner" *ngIf="isLogoutLoading">
    <div class="spinner"></div>
    <span> Logging out... </span>
  </div>

  <!-- Sidebar -->
  <!-- Backdrop (mobile overlay mode) -->
  <div class="sidebar-backdrop" *ngIf="isMobile && isSidebarOpen" (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <nav class="sidebar" [class.collapsed]="!isSidebarOpen" [class.mobile]="isMobile" id="app-sidebar">
    <div class="logo">
      <i class="fas fa-chart-pie fa-2x"></i>
      <span>MoneyFi</span>
    </div>

    <div class="nav-links">
      <button *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="active"
        [class.notification-btn]="item.showBadge" [title]="item.label" (click)="onNavItemClick()">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>

        <!-- Badge (only show when count > 0) -->
        <span class="badge" *ngIf="item.showBadge && notificationCount > 0">
          {{ notificationCount }}
        </span>
      </button>
    </div>

    <button id="gmail-sync-btn" class="btn btn-primary" (click)="onGmailSyncClick(); onNavItemClick()"
      title="Sync Email Transactions">
      <i class="fas fa-sync-alt sync-icon"></i>
      <span>Sync Email Transactions</span>
    </button>

    <div class="user-section">
      <button *ngFor="let item of userItems" [routerLink]="item.route" routerLinkActive="active"
        [title]="item.label" (click)="onNavItemClick()">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </button>
      <button class="logout-btn" (click)="logoutUser()" title="Logout">
        <i class="fas fa-sign-out-alt"></i>
        <span>Logout</span>
      </button>
    </div>
  </nav>

  <!-- Toggle: floats on the sidebar's right edge -->
  <button class="sidebar-toggle" [class.open]="isSidebarOpen" [class.mobile]="isMobile" (click)="toggleSidebar()"
    [attr.aria-expanded]="isSidebarOpen" aria-controls="app-sidebar"
    [attr.aria-label]="isSidebarOpen ? 'Close sidebar' : 'Open sidebar'">
    <i class="fas" [ngClass]="isSidebarOpen ? 'fa-chevron-left' : 'fa-chevron-right'"></i>
  </button>

  <main class="main-content">
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
